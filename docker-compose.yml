services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bets
      POSTGRES_PASSWORD: bets
      POSTGRES_DB: bets
    ports:
      - '55435:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bets']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
